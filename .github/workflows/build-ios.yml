# Builds an UNSIGNED iOS app (.ipa) on a free GitHub macOS machine.
# Sideloadly signs it with your free Apple ID when it installs it on your iPhone.

name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Debug = development build (loads JS live from your PC). Release = standalone (JS built in)."
        required: true
        default: Debug
        type: choice
        options: [Debug, Release]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CONFIGURATION: ${{ inputs.configuration }}
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate the native iOS project (adds the Live Activity extension)
        run: npx expo prebuild -p ios --clean

      - name: Show versions
        run: |
          xcodebuild -version
          pod --version

      - name: Build the app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/OrbitPay.xcworkspace \
            -scheme OrbitPay \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*OrbitActivity|\*\* BUILD" || true
          test -d "build/Build/Products/${CONFIGURATION}-iphoneos/OrbitPay.app"

      - name: Package .ipa
        run: |
          APP="build/Build/Products/${CONFIGURATION}-iphoneos/OrbitPay.app"
          ls "$APP/PlugIns"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "OrbitPay-${CONFIGURATION}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OrbitPay-ipa
          path: OrbitPay-*.ipa
          retention-days: 14

      - name: Upload build log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
